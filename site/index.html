<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Brief Viewer</title>
<style>
  :root {
    --bar: #1c1a16; --bar-ink: #f4f1ea; --bar-muted: #b8b1a3;
    --bg: #4a4844; --accent: #9b1c1c; --accent-ink: #fff;
    --page-shadow: 0 2px 6px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #2a2b2f; --bar: #121316; }
  }
  :root[data-theme="dark"] { --bg: #2a2b2f; --bar: #121316; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--bar-ink);
    font: 14px/1.4 "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--bar); color: var(--bar-ink); padding: 8px 16px;
    border-bottom: 3px solid var(--accent); position: sticky; top: 0; z-index: 5;
  }
  .bar .title { font: 700 15px/1.2 Georgia, "Times New Roman", serif; letter-spacing: .01em; white-space: nowrap; }
  .bar .spacer { flex: 1 1 auto; }
  .bar select, .bar button, .bar a.btn {
    appearance: none; -webkit-appearance: none; border: 1px solid #5a564f; background: #2b2924; color: var(--bar-ink);
    border-radius: 6px; padding: 6px 10px; font: 600 13px/1 "Helvetica Neue", Arial, sans-serif;
    text-decoration: none; cursor: pointer; min-height: 32px;
  }
  .bar select { padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, #b8b1a3 50%), linear-gradient(135deg, #b8b1a3 50%, transparent 50%);
    background-position: calc(100% - 14px) 13px, calc(100% - 9px) 13px; background-size: 5px 5px; background-repeat: no-repeat; max-width: 60vw; }
  .bar button:disabled { opacity: .35; cursor: default; }
  .bar a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .bar .pages { color: var(--bar-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  main { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; padding: 18px 12px 48px; gap: 14px; }
  canvas.page { display: block; background: #fff; box-shadow: var(--page-shadow); max-width: 100%; height: auto; }
  .notice { max-width: 640px; margin: 48px auto; padding: 20px 24px; background: rgba(0,0,0,.35); border-radius: 10px;
    color: var(--bar-ink); text-align: center; font-size: 15px; line-height: 1.5; }
  .notice a { color: #ffd7d7; }
  iframe.fallback { flex: 1 1 auto; width: 100%; min-height: calc(100vh - 60px); border: 0; background: #888; }
  .summary { max-width: 820px; width: 100%; margin: 0; padding: 10px 14px; background: rgba(0,0,0,.28); border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0; color: var(--bar-ink); font: 14px/1.5 Georgia, "Times New Roman", serif; }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .bar { padding: 8px 10px; gap: 8px; }
    .bar .pages { display: none; }
    main { padding: 10px 6px 32px; gap: 10px; }
  }
</style>
</head>
<body>
<div class="bar">
  <span class="title">President's Daily Brief</span>
  <span class="spacer"></span>
  <button type="button" id="prev" title="Newer edition" aria-label="Newer edition">&#8249;</button>
  <select id="edition" aria-label="Edition"></select>
  <button type="button" id="next" title="Older edition" aria-label="Older edition">&#8250;</button>
  <span class="pages" id="pages"></span>
  <a class="btn" id="open" href="#" target="_blank" rel="noopener">Open</a>
  <a class="btn primary" id="download" href="#" download>Download</a>
</div>
<main id="main">
  <div class="notice" id="notice">Loading…</div>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const main = $('main'), notice = $('notice'), sel = $('edition');
  let editions = [], current = -1, pdfjs = null, renderToken = 0, loadedDoc = null;

  function spellDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  }
  function say(html) { notice.innerHTML = html; notice.classList.remove('hidden'); }

  async function loadPdfJs() {
    if (pdfjs) return pdfjs;
    const base = new URL('vendor/pdfjs/', location.href).href;
    const mod = await import(base + 'pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
    pdfjs = mod;
    return mod;
  }

  function clearPages() {
    main.querySelectorAll('canvas.page, iframe.fallback, .summary').forEach((el) => el.remove());
  }

  async function renderDoc(doc, token) {
    const width = Math.min(main.clientWidth - 12, 900);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    for (let n = 1; n <= doc.numPages; n++) {
      if (token !== renderToken) return;
      const page = await doc.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const scale = width / base.width;
      const vp = page.getViewport({ scale: scale * dpr });
      const canvas = document.createElement('canvas');
      canvas.className = 'page';
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      canvas.style.width = Math.floor(vp.width / dpr) + 'px';
      canvas.setAttribute('aria-label', 'Page ' + n);
      main.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d', { alpha: false }), viewport: vp }).promise;
      $('pages').textContent = n + ' / ' + doc.numPages;
    }
  }

  async function show(i) {
    if (i < 0 || i >= editions.length) return;
    current = i;
    const e = editions[i];
    sel.value = e.date;
    $('prev').disabled = i === 0; $('next').disabled = i === editions.length - 1;
    $('open').href = e.pdf; $('download').href = e.pdf;
    $('download').setAttribute('download', e.pdf.split('/').pop());
    document.title = 'PDB ' + spellDate(e.date);
    try { history.replaceState(null, '', '#' + e.date); } catch (err) {}
    const token = ++renderToken;
    clearPages();
    $('pages').textContent = '';
    say('Loading ' + spellDate(e.date) + '…');
    if (e.summary) {
      const s = document.createElement('p'); s.className = 'summary'; s.textContent = e.summary; main.appendChild(s);
    }
    try {
      const lib = await loadPdfJs();
      if (loadedDoc) { try { loadedDoc.destroy(); } catch (err) {} loadedDoc = null; }
      const doc = await lib.getDocument({ url: e.pdf }).promise;
      if (token !== renderToken) { doc.destroy(); return; }
      loadedDoc = doc;
      notice.classList.add('hidden');
      await renderDoc(doc, token);
    } catch (err) {
      // PDF.js unavailable (offline CDN, old browser): hand the PDF to the browser instead.
      notice.classList.add('hidden');
      const f = document.createElement('iframe'); f.className = 'fallback'; f.title = 'PDF'; f.src = e.pdf + '#view=FitH';
      main.appendChild(f);
    }
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (!loadedDoc) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(async () => {
      const token = ++renderToken;
      main.querySelectorAll('canvas.page').forEach((c) => c.remove());
      await renderDoc(loadedDoc, token);
    }, 200);
  });

  sel.addEventListener('change', () => show(editions.findIndex((e) => e.date === sel.value)));
  $('prev').addEventListener('click', () => show(current - 1));
  $('next').addEventListener('click', () => show(current + 1));
  window.addEventListener('keydown', (ev) => {
    if (ev.target === sel) return;
    if (ev.key === 'ArrowLeft') show(current - 1);
    if (ev.key === 'ArrowRight') show(current + 1);
  });

  async function init() {
    try {
      const res = await fetch('briefs/index.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      editions = (data.editions || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    } catch (err) { editions = []; }
    sel.innerHTML = '';
    editions.forEach((e) => {
      const o = document.createElement('option'); o.value = e.date;
      o.textContent = spellDate(e.date) + (e.sample ? ' (sample)' : '');
      sel.appendChild(o);
    });
    if (!editions.length) {
      sel.disabled = true; $('prev').disabled = true; $('next').disabled = true;
      $('open').classList.add('hidden'); $('download').classList.add('hidden');
      say('No editions published yet. The first brief appears here after the next scheduled run.');
      return;
    }
    const want = (location.hash || '').slice(1);
    const idx = editions.findIndex((e) => e.date === want);
    show(idx >= 0 ? idx : 0);
  }
  init();
</script>
</body>
</html>
